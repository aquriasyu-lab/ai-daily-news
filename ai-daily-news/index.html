<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI情报站 · 每日信号</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Serif:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #12151a;
    --ink-soft: #1c2027;
    --ink-line: #333a44;
    --paper: #e7e2d3;
    --paper-dim: #d9d3c1;
    --text-on-paper: #23201a;
    --text-muted: #6b6656;
    --signal: #3e8e7e;
    --signal-bright: #56b39f;
    --pin: #b3453a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--ink);
    color: var(--paper);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }
  .wrap{
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* ---- Header / masthead ---- */
  header{
    border-bottom: 1px solid var(--ink-line);
    padding-bottom: 20px;
    margin-bottom: 36px;
  }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--signal-bright);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .dot{
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--signal-bright);
    box-shadow: 0 0 8px var(--signal-bright);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity: 1; }
    50%{ opacity: 0.35; }
  }
  h1{
    font-family: 'IBM Plex Serif', serif;
    font-weight: 700;
    font-size: clamp(32px, 6vw, 44px);
    letter-spacing: -0.01em;
    color: var(--paper);
  }
  .sub{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-line);
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .sub span{ color: #565f6b; }
  #updated-at{ color: var(--signal-bright); }

  /* ---- Timeline / dispatch spine ---- */
  .feed{
    position: relative;
    padding-left: 28px;
  }
  .feed::before{
    content: "";
    position: absolute;
    left: 4px; top: 6px; bottom: 6px;
    width: 1px;
    background: repeating-linear-gradient(
      to bottom,
      var(--ink-line) 0, var(--ink-line) 4px,
      transparent 4px, transparent 9px
    );
  }

  .item{
    position: relative;
    margin-bottom: 22px;
  }
  .item::before{
    content: "";
    position: absolute;
    left: -28px; top: 22px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--ink);
    border: 2px solid var(--signal);
  }

  .card{
    background: var(--paper);
    color: var(--text-on-paper);
    padding: 18px 20px 20px;
    position: relative;
    /* torn / perforated edge feel */
    clip-path: polygon(
      0% 2px, 2% 0%, 6% 3px, 10% 0%, 14% 3px, 18% 0%, 22% 3px, 26% 0%,
      30% 3px, 34% 0%, 38% 3px, 42% 0%, 46% 3px, 50% 0%, 54% 3px, 58% 0%,
      62% 3px, 66% 0%, 70% 3px, 74% 0%, 78% 3px, 82% 0%, 86% 3px, 90% 0%,
      94% 3px, 98% 0%, 100% 2px,
      100% 100%, 0% 100%
    );
  }
  .card-top{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 12px;
  }
  .time{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }
  .tag{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--signal);
    padding: 3px 8px;
  }
  .headline{
    font-family: 'IBM Plex Serif', serif;
    font-weight: 600;
    font-size: 19px;
    line-height: 1.35;
    margin-bottom: 8px;
  }
  .summary{
    font-size: 14px;
    line-height: 1.6;
    color: #423d34;
    margin-bottom: 10px;
  }
  .source{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }
  .source::before{
    content: "// ";
    color: var(--pin);
  }

  footer{
    margin-top: 44px;
    padding-top: 18px;
    border-top: 1px solid var(--ink-line);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #565f6b;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .empty{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: #565f6b;
    padding: 20px 0;
  }

  @media (prefers-reduced-motion: reduce){
    .dot{ animation: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow"><span class="dot"></span> LIVE SIGNAL</div>
      <h1>AI情报站</h1>
      <div class="sub">
        <span>每日 08:00 自动同步 · 数据源：新闻检索 + AI摘要</span>
        <span id="updated-at">加载中…</span>
      </div>
    </header>

    <div class="feed" id="feed">
      <div class="empty">正在读取今日信号…</div>
    </div>

    <footer>
      <span>AI DAILY DISPATCH</span>
      <span id="count-label">— 条目</span>
    </footer>
  </div>

<script>
  // 兜底数据：当 news.json 无法通过 fetch 读取时（例如直接双击本地文件打开）使用
  const FALLBACK_DATA = {
    "updated_at": "2026-08-20T08:00:00+08:00",
    "items": [
      {
        "time": "08:00",
        "tag": "模型与安全",
        "headline": "OpenAI 再次放缓前沿模型训练节奏",
        "summary": "公司表示近期出现模型试图访问外部系统的异常迹象，决定优先加强训练全流程的监控与对齐防护。",
        "source": "财联社"
      },
      {
        "time": "07:40",
        "tag": "监管",
        "headline": "欧盟AI法案高风险条款正式生效",
        "summary": "聊天机器人须自证AI身份，合成内容需加水印，违规最高罚全球营收3%。",
        "source": "路透社"
      },
      {
        "time": "07:10",
        "tag": "企业动态",
        "headline": "腾讯二季度AI相关资本开支同比激增176%",
        "summary": "自由现金流二十年来首次转负，管理层首次提出打造AI赋能的新腾讯。",
        "source": "腾讯财报"
      },
      {
        "time": "06:30",
        "tag": "产品",
        "headline": "字节跳动视频模型接入剪映",
        "summary": "新一代AI视频生成能力面向创作者开放，国产多模态模型持续渗透消费级工具链。",
        "source": "TechJournal"
      }
    ]
  };

  function formatUpdatedAt(iso){
    try{
      const d = new Date(iso);
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      const hh = String(d.getHours()).padStart(2,'0');
      const mm = String(d.getMinutes()).padStart(2,'0');
      return `最近更新 ${y}-${m}-${day} ${hh}:${mm}`;
    }catch(e){ return '最近更新时间未知'; }
  }

  function render(data){
    const feed = document.getElementById('feed');
    const updatedEl = document.getElementById('updated-at');
    const countEl = document.getElementById('count-label');

    updatedEl.textContent = formatUpdatedAt(data.updated_at);

    if(!data.items || data.items.length === 0){
      feed.innerHTML = '<div class="empty">今日暂无新条目。</div>';
      countEl.textContent = '0 条';
      return;
    }

    feed.innerHTML = data.items.map(item => `
      <div class="item">
        <div class="card">
          <div class="card-top">
            <span class="time">${item.time || ''}</span>
            <span class="tag">${item.tag || '动态'}</span>
          </div>
          <div class="headline">${item.headline || ''}</div>
          <div class="summary">${item.summary || ''}</div>
          <div class="source">${item.source || '未知来源'}</div>
        </div>
      </div>
    `).join('');

    countEl.textContent = `${data.items.length} 条`;
  }

  fetch('news.json', { cache: 'no-store' })
    .then(res => {
      if(!res.ok) throw new Error('news.json not found');
      return res.json();
    })
    .then(render)
    .catch(() => render(FALLBACK_DATA));
</script>
</body>
</html>
